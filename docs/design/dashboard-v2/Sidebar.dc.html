<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هُدهُد: القائمة الجانبية</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hodhod.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Tajawal:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="hd" style="min-height: 0; background: transparent; font-family: 'IBM Plex Sans Arabic', 'Tajawal', sans-serif; color: #121A2E">

<!-- desktop sidebar (right side in RTL) -->
<aside class="sb" aria-label="القائمة الرئيسية">
<div class="sb-top">
<a class="wordmark" href="Main.dc.html"><img src="/_blob/42cc7e2cd03a6fde924c98a24846265f" alt="" width="28" height="36">هُدهُد</a>
<div class="biz">
<span class="av c0" aria-hidden="true">ل</span>
<div class="grow">
<b class="trunc">مركز لمسة للتجميل</b>
<span class="{{waCls}}"><span class="{{waDot}}" aria-hidden="true"></span>{{waText}}</span>
</div>
</div>
</div>
<nav class="nav" aria-label="أقسام لوحة التحكم">
<sc-for list="{{main}}" as="n" hint-placeholder-count="8">
<a class="{{n.cls}}" href="{{n.href}}" aria-current="{{n.current}}">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span>{{n.label}}</span>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{false}}"><span class="{{n.countCls}}" aria-label="{{n.countLabel}}">{{n.count}}</span></sc-if>
</a>
</sc-for>
<div class="nav-sep">الإعدادات</div>
<sc-for list="{{settings}}" as="n" hint-placeholder-count="2">
<a class="{{n.cls}}" href="{{n.href}}" aria-current="{{n.current}}">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span>{{n.label}}</span>
</a>
</sc-for>
</nav>
<div class="sb-foot">
<span class="av sm c1" aria-hidden="true">ر</span>
<div class="grow" style="line-height: 1.35">
<b style="display: block; font-size: 14px">رنا خوري</b>
<span class="subtle">مالكة الحساب</span>
</div>
<a class="ib sm" href="Account.dc.html" aria-label="إعدادات الحساب"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
</div>
</aside>

<!-- mobile / tablet top bar -->
<header class="mbar">
<button type="button" class="ib" onClick="{{openMenu}}" aria-label="فتح القائمة" aria-expanded="{{openAria}}" aria-controls="m-drawer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
<a class="wordmark" href="Main.dc.html" style="font-size: 20px"><img src="/_blob/42cc7e2cd03a6fde924c98a24846265f" alt="" width="22" height="28">هُدهُد</a>
<span class="grow"></span>
<span class="{{waCls}}" style="font-size: 12px"><span class="{{waDot}}" aria-hidden="true"></span><span class="hide-m">{{waText}}</span></span>
<a class="ib" href="Attention.dc.html" aria-label="طلبات تحتاج تدخلك: 3" style="position: relative; color: #9A4A06"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg><span class="count hot" style="position: absolute; top: 2px; left: 2px; min-width: 18px; height: 18px; font-size: 11px">3</span></a>
</header>

<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div class="mscrim" onClick="{{closeMenu}}"></div>
<aside id="m-drawer" class="mdrawer" role="dialog" aria-modal="true" aria-label="القائمة الرئيسية">
<div class="sb-top">
<div class="row">
<a class="wordmark grow" href="Main.dc.html"><img src="/_blob/42cc7e2cd03a6fde924c98a24846265f" alt="" width="26" height="34">هُدهُد</a>
<button type="button" class="ib" onClick="{{closeMenu}}" aria-label="إغلاق القائمة"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div class="biz">
<span class="av c0" aria-hidden="true">ل</span>
<div class="grow">
<b class="trunc">مركز لمسة للتجميل</b>
<span class="{{waCls}}"><span class="{{waDot}}" aria-hidden="true"></span>{{waText}}</span>
</div>
</div>
</div>
<nav class="nav" aria-label="أقسام لوحة التحكم">
<sc-for list="{{main}}" as="n" hint-placeholder-count="8">
<a class="{{n.cls}}" href="{{n.href}}" aria-current="{{n.current}}">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span>{{n.label}}</span>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{false}}"><span class="{{n.countCls}}">{{n.count}}</span></sc-if>
</a>
</sc-for>
<div class="nav-sep">الإعدادات</div>
<sc-for list="{{settings}}" as="n" hint-placeholder-count="2">
<a class="{{n.cls}}" href="{{n.href}}" aria-current="{{n.current}}">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span>{{n.label}}</span>
</a>
</sc-for>
</nav>
<div class="sb-foot" style="padding-bottom: max(12px, env(safe-area-inset-bottom))">
<span class="av sm c1" aria-hidden="true">ر</span>
<div class="grow" style="line-height: 1.35"><b style="display: block; font-size: 14px">رنا خوري</b><span class="subtle">مالكة الحساب</span></div>
</div>
</aside>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","attention","orders","bookings","catalog","business","faq","ai","account"],"default":"home"},"wa":{"editor":"enum","options":["on","off","warn"],"default":"on"},"$preview":{"width":268,"height":900}}'>
const NAV = [
  { k: 'home', label: 'الرئيسية', href: 'Main.dc.html', icon: 'M4 11l8-7 8 7v9h-5v-6H9v6H4z' },
  { k: 'attention', label: 'تحتاج تدخلك', href: 'Attention.dc.html', icon: 'M12 9v4M12 17h.01M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', count: 3, countCls: 'count hot', countLabel: '3 طلبات مساعدة مفتوحة', attn: true },
  { k: 'orders', label: 'الطلبات', href: 'Orders.dc.html', icon: 'M6 7h12l1 13H5zM9 7a3 3 0 0 1 6 0', count: 2, countCls: 'count warm', countLabel: '2 طلبات جديدة' },
  { k: 'bookings', label: 'الحجوزات', href: 'Bookings.dc.html', icon: 'M4 5h16v15H4zM4 10h16M9 3v4M15 3v4' },
  { k: 'catalog', label: 'المنتجات والخدمات', href: 'Catalog.dc.html', icon: 'M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01' },
  { k: 'business', label: 'معلومات نشاطك', href: 'Business.dc.html', icon: 'M4 9l1.5-5h13L20 9M4 9h16v11H4zM9 20v-6h6v6' },
  { k: 'faq', label: 'الأسئلة الشائعة', href: 'FAQ.dc.html', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3 2.4c-.4.2-.5.5-.5.9v.7M12 16.5h.01' }
];
const SETTINGS = [
  { k: 'ai', label: 'إعدادات هُدهُد', href: 'AISettings.dc.html', icon: 'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4' },
  { k: 'account', label: 'إعدادات الحساب', href: 'Account.dc.html', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0' }
];

class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const active = this.props.active || 'home';
    const wa = this.props.wa || 'on';
    const mk = (n) => ({
      label: n.label, href: n.href, icon: n.icon,
      cls: (n.attn ? 'attn-link ' : '') + (active === n.k ? 'on' : ''),
      current: active === n.k ? 'page' : 'false',
      hasCount: !!n.count, count: n.count || '', countCls: n.countCls || '', countLabel: n.countLabel || ''
    });
    return {
      main: NAV.map(mk), settings: SETTINGS.map(mk),
      waCls: wa === 'on' ? 'wa-status' : (wa === 'off' ? 'wa-status off' : 'wa-status warn'),
      waDot: wa === 'on' ? 'pulse' : 'dot-x',
      waText: wa === 'on' ? 'واتساب متصل · هُدهُد يعمل' : (wa === 'off' ? 'واتساب غير متصل' : 'الاتصال يحتاج إلى انتباه'),
      open: this.state.open, openAria: this.state.open ? 'true' : 'false',
      openMenu: () => this.setState({ open: true }),
      closeMenu: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
